name = "cobrasmash-social-publish"
main = "src/index.js"
compatibility_date = "2026-09-28"

# Polls data/news.json and posts new Latest Buzz items to Facebook + Instagram.
[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "SOCIAL_PUBLISH_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID" # see README.md for setup
