<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Cobra Smash Badminton Club</title>
    <meta name="description" content="That page doesn't exist. Head back to the Cobra Smash Badminton Club home page.">

    <!-- Keep soft-404 URLs out of search results. The presence of this file is
         also what stops Cloudflare Pages serving index.html with a 200 for
         every unmatched path (its single-page-app fallback). -->
    <meta name="robots" content="noindex, follow">

    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/images/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <meta name="theme-color" content="#0a0a0a">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400&display=swap">

    <!-- Styles are inline rather than an import of main.css: this page must render
         correctly with no JS, and main.css expects JS to set --current-header-height.
         Colours are the same tokens as _base.css. -->
    <style>
        :root {
            --color-black-base: #0A0A0A;
            --color-cobra-yellow: #FFC107;
            --color-tagline-orange-yellow: #FFAE00;
            --color-text-light: #EAEAEA;
            --color-text-medium: #cccccc;
            --font-primary: 'Oswald', Impact, sans-serif;
            --font-body: 'Roboto', Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 2rem 1rem;
            text-align: center;
            font-family: var(--font-body);
            line-height: 1.6;
            background-color: var(--color-black-base);
            color: var(--color-text-light);
        }

        .logo { width: 140px; height: auto; }

        .code {
            font-family: var(--font-primary);
            font-size: clamp(3.5rem, 15vw, 6rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: 2px;
            color: var(--color-cobra-yellow);
        }

        h1 {
            font-family: var(--font-primary);
            font-size: clamp(1.25rem, 5vw, 1.75rem);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            max-width: 32rem;
            color: var(--color-text-medium);
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border-radius: 4px;
            font-family: var(--font-primary);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
            padding: 0.6rem 1.2rem;
            color: var(--color-black-base);
            background-color: var(--color-cobra-yellow);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        .btn:hover,
        .btn:focus-visible {
            background-color: var(--color-tagline-orange-yellow);
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @media (prefers-reduced-motion: reduce) {
            .btn { transition: none; }
            .btn:hover, .btn:focus-visible { transform: none; }
        }
    </style>
</head>
<body>
    <img class="logo" src="/assets/images/csbs-logo.webp" alt="Cobra Smash Badminton Club">
    <p class="code">404</p>
    <h1>Page Not Found</h1>
    <p>That shot landed outside the lines. The page you were after doesn't exist or has moved.</p>
    <a class="btn" href="/">Back to the Club</a>
</body>
</html>
